[package]
name = "photosweep"
version = "1.0.0"
description = "Smart gallery analyzer and cleaner - find duplicates & temp files"
authors = ["PhotoSweep Team"]
edition = "2024"

[lib]
name = "photosweep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "device-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
md5 = "0.7"
sha2 = "0.10"
rustc-hash = "1.1"
flume = "0.10"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true